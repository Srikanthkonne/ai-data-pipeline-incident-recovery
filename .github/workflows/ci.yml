name: CI

on:
  push:
    branches:
      - main
      - phase4-platformization
  pull_request:
    branches:
      - main
      - phase4-platformization
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataengineer
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataengineer -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce
      POSTGRES_USER: dataengineer
      POSTGRES_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize test database
        run: ./scripts/init_test_db.sh

      - name: Compile Python modules
        run: |
          python -m compileall -q api incident_service tests

      - name: Run integration and chaos tests
        run: pytest -q tests/integration

      - name: FastAPI health and readiness smoke test
        run: |
          python -c "from fastapi.testclient import TestClient; from api.main import app; c=TestClient(app); h=c.get('/health'); assert h.status_code == 200, h.text; r=c.get('/ready'); assert r.status_code == 200, r.text; print('FastAPI health and readiness checks passed')"

  terraform-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Check AWS Terraform formatting
        run: terraform -chdir=infrastructure/terraform/aws fmt -check

      - name: Initialize AWS Terraform without backend
        run: |
          terraform -chdir=infrastructure/terraform/aws init \
            -backend=false \
            -lockfile=readonly

      - name: Validate AWS Terraform
        run: terraform -chdir=infrastructure/terraform/aws validate

      - name: Check bootstrap Terraform formatting
        run: terraform -chdir=infrastructure/terraform/bootstrap fmt -check

      - name: Initialize bootstrap Terraform without backend
        run: |
          terraform -chdir=infrastructure/terraform/bootstrap init \
            -backend=false \
            -lockfile=readonly

      - name: Validate bootstrap Terraform
        run: terraform -chdir=infrastructure/terraform/bootstrap validate
