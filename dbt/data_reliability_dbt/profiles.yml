data_reliability_dbt:
  target: dev

  outputs:
    dev:
      type: duckdb
      path: data_reliability.duckdb
      threads: 4

      extensions:
        - httpfs
        - parquet

      settings:
        s3_endpoint: "{{ env_var('DBT_S3_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
        s3_use_ssl: false
        s3_url_style: "path"
        s3_region: "us-east-1"
