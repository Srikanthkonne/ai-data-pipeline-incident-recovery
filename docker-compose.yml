services:

  # =========================================================
  # Source PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: incident-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data-platform-network


  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: incident-platform-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT_HOST://0.0.0.0:9092,
        PLAINTEXT_DOCKER://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT_HOST://localhost:9092,
        PLAINTEXT_DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        PLAINTEXT_DOCKER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - data-platform-network


  # =========================================================
  # MinIO
  # =========================================================
  minio:
    image: minio/minio:latest
    container_name: incident-platform-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - data-platform-network


  # =========================================================
  # Spark + PyDeequ
  # =========================================================
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile

    image: incident-spark-deequ:3.5.1

    container_name: incident-platform-spark

    command:
      - /bin/bash
      - -c
      - sleep infinity

    environment:
      # MinIO / S3A
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./spark:/opt/spark/work-dir

    depends_on:
      - kafka
      - minio

    networks:
      - data-platform-network


  # =========================================================
  # Marquez Metadata PostgreSQL
  # =========================================================
  marquez-postgres:
    image: postgres:14
    container_name: incident-platform-marquez-postgres
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      POSTGRES_DB: marquez
    volumes:
      - marquez_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U marquez -d marquez
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-platform-network

  # =========================================================
  # Marquez API
  # =========================================================
  marquez-api:
    image: marquezproject/marquez:0.50.0
    platform: linux/amd64
    container_name: incident-platform-marquez-api
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      SEARCH_ENABLED: "false"
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
    volumes:
      - ./marquez/marquez.yml:/usr/src/app/marquez.yml:ro
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      marquez-postgres:
        condition: service_healthy
    networks:
      - data-platform-network

  # =========================================================
  # Marquez Web UI
  # =========================================================
  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    platform: linux/amd64
    container_name: incident-platform-marquez-web
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "3000:3000"
    depends_on:
      - marquez-api
    networks:
      - data-platform-network

  # =========================================================
  # Airflow Metadata PostgreSQL
  # =========================================================
  airflow-postgres:
    image: postgres:16
    container_name: incident-platform-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data-platform-network


  # =========================================================
  # Airflow Initialization
  # =========================================================
  airflow-init:
    image: apache/airflow:2.10.5
    container_name: incident-platform-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

    command:
      - /bin/bash
      - -c
      - |
        set -e

        echo "Migrating Airflow database..."
        airflow db migrate

        echo "Checking Airflow admin user..."

        if airflow users list | grep -q "$${AIRFLOW_ADMIN_USERNAME}"; then
          echo "Airflow admin user already exists."
        else
          echo "Creating Airflow admin user..."

          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com
        fi

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    networks:
      - data-platform-network


  # =========================================================
  # Airflow Webserver
  # =========================================================
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: incident-platform-airflow-webserver

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command:
      - airflow
      - webserver

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    networks:
      - data-platform-network


  # =========================================================
  # Airflow Scheduler
  # =========================================================
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: incident-platform-airflow-scheduler

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command:
      - airflow
      - scheduler

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    networks:
      - data-platform-network


# =========================================================
# Persistent Volumes
# =========================================================
volumes:
  postgres_data:
  kafka_data:
  minio_data:
  airflow_postgres_data:
  marquez_postgres_data:


# =========================================================
# Docker Network
# =========================================================
networks:
  data-platform-network:
    driver: bridge