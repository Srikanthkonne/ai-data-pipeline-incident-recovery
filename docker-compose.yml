services:

  # =========================================================
  # Source PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16
    container_name: incident-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data-platform-network


  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: incident-platform-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT_HOST://0.0.0.0:9092,
        PLAINTEXT_DOCKER://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT_HOST://localhost:9092,
        PLAINTEXT_DOCKER://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        PLAINTEXT_DOCKER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - data-platform-network


  # =========================================================
  # MinIO
  # =========================================================
  minio:
    image: minio/minio:latest
    container_name: incident-platform-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - data-platform-network


  # =========================================================
  # Spark + PyDeequ
  # =========================================================
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile

    image: incident-spark-deequ:3.5.1

    container_name: incident-platform-spark

    command:
      - /bin/bash
      - -c
      - sleep infinity

    environment:
      # MinIO / S3A
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./spark:/opt/spark/work-dir

    depends_on:
      - kafka
      - minio

    networks:
      - data-platform-network


  # =========================================================
  # Marquez Metadata PostgreSQL
  # =========================================================
  marquez-postgres:
    image: postgres:14
    container_name: incident-platform-marquez-postgres
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      POSTGRES_DB: marquez
    volumes:
      - marquez_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U marquez -d marquez
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-platform-network

  # =========================================================
  # Marquez API
  # =========================================================
  marquez-api:
    image: marquezproject/marquez:0.50.0
    platform: linux/amd64
    container_name: incident-platform-marquez-api
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      SEARCH_ENABLED: "false"
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
    volumes:
      - ./marquez/marquez.yml:/usr/src/app/marquez.yml:ro
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      marquez-postgres:
        condition: service_healthy
    networks:
      - data-platform-network

  # =========================================================
  # Marquez Web UI
  # =========================================================
  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    platform: linux/amd64
    container_name: incident-platform-marquez-web
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "3000:3000"
    depends_on:
      - marquez-api
    networks:
      - data-platform-network

  # =========================================================
  # Neo4j Lineage Graph Store
  # =========================================================
  neo4j:
    image: neo4j:5.26.30
    container_name: incident-platform-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - data-platform-network

  # =========================================================
  # Phase 2 Pipeline Runner
  # =========================================================
  pipeline-runner:
    build:
      context: .
      dockerfile: infrastructure/pipeline-runner/Dockerfile
    image: incident-platform-pipeline-runner:1.0
    container_name: incident-platform-pipeline-runner
    environment:
      DBT_S3_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      MARQUEZ_URL: http://marquez-api:5000
      MARQUEZ_NAMESPACE: incident-platform

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dbt:/workspace/dbt
      - ./lineage:/workspace/lineage
      - ./metadata:/workspace/metadata
    networks:
      - data-platform-network

  # =========================================================
  # Airflow Metadata PostgreSQL
  # =========================================================
  airflow-postgres:
    image: postgres:16
    container_name: incident-platform-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data-platform-network


  # =========================================================
  # Airflow Initialization
  # =========================================================
  airflow-init:
    image: apache/airflow:2.10.5
    container_name: incident-platform-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

    command:
      - /bin/bash
      - -c
      - |
        set -e

        echo "Migrating Airflow database..."
        airflow db migrate

        echo "Checking Airflow admin user..."

        if airflow users list | grep -q "$${AIRFLOW_ADMIN_USERNAME}"; then
          echo "Airflow admin user already exists."
        else
          echo "Creating Airflow admin user..."

          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com
        fi

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    networks:
      - data-platform-network


  # =========================================================
  # Airflow Webserver
  # =========================================================
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: incident-platform-airflow-webserver

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command:
      - airflow
      - webserver

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    networks:
      - data-platform-network


  # =========================================================
  # Airflow Scheduler
  # =========================================================
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: incident-platform-airflow-scheduler

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command:
      - airflow
      - scheduler

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/project/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - data-platform-network


  # =========================================================
  # Phase 4 FastAPI Control Plane
  # =========================================================

  incident-api:
    build:
      context: .
      dockerfile: infrastructure/app/Dockerfile
      target: api
    image: incident-recovery-api:phase4f
    container_name: incident-platform-api
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data-platform-network


  # =========================================================
  # Phase 4 Autonomous Recovery Worker
  # =========================================================

  recovery-worker:
    build:
      context: .
      dockerfile: infrastructure/app/Dockerfile
      target: worker
    image: incident-recovery-worker:phase4f
    container_name: incident-platform-recovery-worker

    # Explicit opt-in prevents an accidental autonomous worker
    # startup during a normal `docker compose up`.
    profiles:
      - automation

    # DRY_RUN exits after one cycle, so automatic restart would
    # otherwise create a tight restart loop.
    restart: "no"
    init: true
    stop_grace_period: 20s
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      spark:
        condition: service_started
      neo4j:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}

      INCIDENT_WORKER_POLL_INTERVAL_SECONDS: ${INCIDENT_WORKER_POLL_INTERVAL_SECONDS:-10}
      INCIDENT_WORKER_MAX_INCIDENTS_PER_CYCLE: ${INCIDENT_WORKER_MAX_INCIDENTS_PER_CYCLE:-1}
      INCIDENT_WORKER_DRY_RUN: ${INCIDENT_WORKER_DRY_RUN:-true}
      INCIDENT_WORKER_MAX_AUTONOMOUS_ATTEMPTS: ${INCIDENT_WORKER_MAX_AUTONOMOUS_ATTEMPTS:-3}
      INCIDENT_WORKER_QUEUE_CLAIM_SECONDS: ${INCIDENT_WORKER_QUEUE_CLAIM_SECONDS:-300}
      INCIDENT_WORKER_QUEUE_HEARTBEAT_INTERVAL_SECONDS: ${INCIDENT_WORKER_QUEUE_HEARTBEAT_INTERVAL_SECONDS:-60}
      INCIDENT_WORKER_RETRY_BASE_SECONDS: ${INCIDENT_WORKER_RETRY_BASE_SECONDS:-60}
      INCIDENT_WORKER_RETRY_MAX_SECONDS: ${INCIDENT_WORKER_RETRY_MAX_SECONDS:-1800}
    volumes:
      - ./spark:/app/spark:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data-platform-network



# =========================================================
# Persistent Volumes
# =========================================================

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  airflow_postgres_data:
  marquez_postgres_data:
  neo4j_data:


# =========================================================
# Docker Network
# =========================================================
networks:
  data-platform-network:
    driver: bridge